# =============================================================
# ci.yml — Pipeline de Integração Contínua (CI)
#
# Responsabilidades:
#   · Buscar última tag/release do GitHub
#   · Sincronizar package.json com versão da última tag
#   · Sincronizar CHANGELOG.md com releases do GitHub
#   · Validar mensagens de commit do Pull Request
#   · Executar testes do backend e frontend
#   · Garantir que só código validado possa ser mergeado na main
#
# Gatilho: abertura, atualização e reabertura de PRs para main
#
# IMPORTANTE: Os nomes dos jobs (validate-commits, test-backend, test-frontend)
# devem ser idênticos aos status checks configurados na branch ruleset.
# =============================================================

name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# Cancela execuções anteriores do mesmo PR ao receber novos commits
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Informações de Versão
  # Busca última tag do GitHub e sincroniza package.json
  # ============================================================
  version-info:
    name: version-info
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de tooling
        run: npm ci --ignore-scripts

      - name: Buscar última tag do GitHub
        id: get-tag
        run: |
          echo "[INFO] Buscando ultima tag do GitHub..."
          
          # Buscar última tag via git
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "[WARN] Nenhuma tag encontrada, usando versão do package.json"
            LATEST_VERSION=$(node -p "require('./package.json').version")
          else
            # Remover 'v' do início da tag se existir
            LATEST_VERSION=${LATEST_TAG#v}
            echo "[OK] Ultima tag encontrada: $LATEST_TAG (versão: $LATEST_VERSION)"
          fi
          
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Sincronizar versões dos package.json
        id: sync
        run: |
          echo "[INFO] Sincronizando versões para v${{ steps.get-tag.outputs.version }}..."
          
          # Versão alvo (da última tag)
          TARGET_VERSION="${{ steps.get-tag.outputs.version }}"
          
          # Versões atuais
          ROOT_VERSION=$(node -p "require('./package.json').version")
          FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")
          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          
          echo "[INFO] Versões atuais:"
          echo "   Raiz: $ROOT_VERSION"
          echo "   Frontend: $FRONTEND_VERSION"
          echo "   Backend: $BACKEND_VERSION"
          echo "   Alvo: $TARGET_VERSION"
          
          # Verificar se precisa sincronizar
          if [ "$ROOT_VERSION" = "$TARGET_VERSION" ] && \
             [ "$FRONTEND_VERSION" = "$TARGET_VERSION" ] && \
             [ "$BACKEND_VERSION" = "$TARGET_VERSION" ]; then
            echo "synced=true" >> $GITHUB_OUTPUT
            echo "[OK] Todas as versões já estão sincronizadas em $TARGET_VERSION"
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "[INFO] Sincronizando versões para $TARGET_VERSION..."
            
            # Atualizar package.json raiz
            node -e "const pkg=require('./package.json');pkg.version='$TARGET_VERSION';require('fs').writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n')"
            
            # Atualizar package.json frontend
            node -e "const pkg=require('./frontend/package.json');pkg.version='$TARGET_VERSION';require('fs').writeFileSync('frontend/package.json',JSON.stringify(pkg,null,2)+'\n')"
            
            # Atualizar package.json backend
            node -e "const pkg=require('./backend/package.json');pkg.version='$TARGET_VERSION';require('fs').writeFileSync('backend/package.json',JSON.stringify(pkg,null,2)+'\n')"
            
            echo "[OK] Versões sincronizadas para $TARGET_VERSION"
          fi

      - name: Commit de sincronização (se necessário)
        if: steps.sync.outputs.synced == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add package.json frontend/package.json backend/package.json
          git commit -m "chore: sincronizar versões dos package.json para v${{ steps.get-tag.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
          
          echo "[OK] Versões sincronizadas e commitadas no PR"

      - name: Exibir informações de versão
        run: |
          echo "## Informações de Versão" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Última Tag** | \`${{ steps.get-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Versão Alvo** | \`${{ steps.get-tag.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace | Versão |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Raiz** | \`$(node -p "require('./package.json').version")\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | \`$(node -p "require('./frontend/package.json').version")\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | \`$(node -p "require('./backend/package.json').version")\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.sync.outputs.synced }}" = "true" ]; then
            echo "✅ **Status:** Todas as versões estão sincronizadas com a última tag" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Versões foram sincronizadas automaticamente com a última tag" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Um commit de sincronização foi adicionado ao PR." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Próxima Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Após o merge deste PR, o semantic-release irá:" >> $GITHUB_STEP_SUMMARY
          echo "- Analisar os commits do PR" >> $GITHUB_STEP_SUMMARY
          echo "- Calcular a próxima versão automaticamente" >> $GITHUB_STEP_SUMMARY
          echo "- Criar tag, release e atualizar CHANGELOG.md" >> $GITHUB_STEP_SUMMARY
          echo "- Sincronizar todos os package.json" >> $GITHUB_STEP_SUMMARY
          echo "- Disparar deploy no Render" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: Sincronização do CHANGELOG
  # Sincroniza CHANGELOG.md com releases reais do GitHub
  # ============================================================
  sync-changelog:
    name: sync-changelog
    runs-on: ubuntu-latest
    needs: version-info

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de tooling
        run: npm ci --ignore-scripts

      - name: Sincronizar CHANGELOG com GitHub
        id: sync
        run: |
          echo "[INFO] Sincronizando CHANGELOG.md com releases do GitHub..."
          
          # Executar script de sincronização
          npm run sync:changelog
          
          # Verificar se há mudanças
          if git diff --quiet CHANGELOG.md; then
            echo "synced=true" >> $GITHUB_OUTPUT
            echo "[OK] CHANGELOG.md já está sincronizado"
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "[INFO] CHANGELOG.md foi atualizado com dados reais do GitHub"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit de sincronização (se necessário)
        if: steps.sync.outputs.synced == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add CHANGELOG.md
          git commit -m "docs: sincronizar CHANGELOG.md com releases do GitHub [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
          
          echo "[OK] CHANGELOG.md sincronizado e commitado no PR"

      - name: Exibir resumo da sincronização
        run: |
          echo "## Sincronização do CHANGELOG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.sync.outputs.synced }}" = "true" ]; then
            echo "✅ **Status:** CHANGELOG.md já está sincronizado com o GitHub" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** CHANGELOG.md foi atualizado com dados reais do GitHub" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Um commit de sincronização foi adicionado ao PR." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Informações" >> $GITHUB_STEP_SUMMARY
          echo "- O CHANGELOG é sincronizado automaticamente com as releases do GitHub" >> $GITHUB_STEP_SUMMARY
          echo "- Todas as datas, títulos e notas são extraídos da API do GitHub" >> $GITHUB_STEP_SUMMARY
          echo "- Garante que o CHANGELOG sempre reflete a realidade do repositório" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 3: Validação de Commits
  # Verifica se todos os commits do PR seguem Conventional Commits
  # Merge commits (ex: "Merge pull request #5") são ignorados automaticamente
  # ============================================================
  validate-commits:
    name: validate-commits
    runs-on: ubuntu-latest
    needs: [version-info, sync-changelog]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências de tooling
        run: npm ci --ignore-scripts

      - name: Validar mensagens de commit do PR
        run: |
          echo "Validando commits do PR..."
          echo "Range: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose
        env:
          FORCE_COLOR: '1'

      - name: Resumo da validação
        if: success()
        run: |
          echo "## ✅ Commits Validados" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Todos os commits do PR seguem Conventional Commits." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commits analisados:** ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Erro na validação
        if: failure()
        run: |
          echo "## ❌ Validação Falhou" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Um ou mais commits não seguem o formato Conventional Commits." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Formato Esperado" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "<tipo>(<escopo opcional>): <descrição>" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tipos Válidos" >> $GITHUB_STEP_SUMMARY
          echo "- \`feat\` — Nova funcionalidade (gera MINOR release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`fix\` — Correção de bug (gera PATCH release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`perf\` — Melhoria de performance (gera PATCH release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`revert\` — Reverter commit (gera PATCH release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`refactor\` — Refatoração (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`docs\` — Documentação (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`test\` — Testes (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`build\` — Build (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ci\` — CI/CD (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`chore\` — Manutenção (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "- \`style\` — Estilo (sem release)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Exemplos" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "feat(pedidos): adiciona filtro por status" >> $GITHUB_STEP_SUMMARY
          echo "fix(api): corrige timeout na rota de pagamentos" >> $GITHUB_STEP_SUMMARY
          echo "feat!: remove suporte ao método de pagamento legado" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 2: Testes Backend
  # Executa suite de testes da API Node.js/Express
  # ============================================================
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci

      - name: Executar testes
        run: npm run test:run
        env:
          NODE_ENV: test
          CI: true

      - name: Resumo dos testes
        if: success()
        run: |
          echo "## ✅ Testes Backend Passaram" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Todos os testes do backend foram executados com sucesso." >> $GITHUB_STEP_SUMMARY

      - name: Erro nos testes
        if: failure()
        run: |
          echo "## ❌ Testes Backend Falharam" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Um ou mais testes do backend falharam." >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs acima para detalhes sobre as falhas." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # JOB 3: Testes Frontend
  # Executa suite de testes React/Vite
  # ============================================================
  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    needs: validate-commits

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Executar testes
        run: npm run test:run
        env:
          CI: true

      - name: Resumo dos testes
        if: success()
        run: |
          echo "## ✅ Testes Frontend Passaram" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Todos os testes do frontend foram executados com sucesso." >> $GITHUB_STEP_SUMMARY

      - name: Erro nos testes
        if: failure()
        run: |
          echo "## ❌ Testes Frontend Falharam" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Um ou mais testes do frontend falharam." >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs acima para detalhes sobre as falhas." >> $GITHUB_STEP_SUMMARY
